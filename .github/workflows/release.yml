name: release-apk
# Builds the release APKs and publishes them as a GitHub Release so they can
# be downloaded without signing in (Actions artifacts need a login and expire).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release APKs (universal + per ABI)
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/malaysia-radio-player-universal.apk
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/malaysia-radio-player-arm32-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/malaysia-radio-player-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/malaysia-radio-player-x86_64.apk
      - name: Verify minSdk 23 and checksums
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          for f in dist/*.apk; do
            $AAPT dump xmltree --file AndroidManifest.xml "$f" | grep minSdkVersion | grep -q '=23' || { echo "minSdk != 23 in $f"; exit 1; }
            echo "$f $(stat -c %s "$f") bytes"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Malaysia Radio Player ${{ steps.tag.outputs.name }}
          prerelease: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            Malaysia Radio Player — APK release (Flutter 3.24.5, minSdk 23 / Android 6.0+).

            **Fail mana perlu dimuat turun?**
            | Peranti | Fail |
            |---|---|
            | Kebanyakan telefon / tablet / TV box moden (64-bit) | `malaysia-radio-player-arm64-v8a.apk` |
            | Peranti lama / TV box murah (32-bit) | `malaysia-radio-player-arm32-armeabi-v7a.apk` |
            | Tidak pasti | `malaysia-radio-player-universal.apk` (semua ABI, lebih besar) |

            Pasang: benarkan "Sumber tidak diketahui / Install unknown apps", buka fail APK.
            Semak integriti dengan `SHA256SUMS.txt`.

            **Status ujian:** binaan, `flutter analyze`, ujian unit/widget dan 13 ujian pada
            **emulator** Android 6.0 (API 23) lulus. Belum diuji pada peranti fizikal Android 6.0
            atau TV box ARM — sebab itu ditanda *pre-release*.

            **Nota:** APK ditandatangani dengan kunci *debug* (tiada kunci release disediakan).
            Ia boleh dipasang secara sideload, tetapi tidak sesuai untuk Google Play, dan versi
            yang ditandatangani dengan kunci lain kelak perlu dipasang semula (nyahpasang dahulu).
